# adcore-run's primary config. Pick one of each group:
#   adcore-run model=patchcore_wrn50 experiment=mvtec_fewshot launcher=gpus
# A downstream repo adds its own groups with --config-dir (see the README).
defaults:
  - model: patchcore_wrn50
  - experiment: mvtec_fewshot
  - launcher: single
  - _self_

# One directory per (experiment, model, variant): rerunning resumes it.
output_root: runs
# Tells hyperparameter combinations apart: the model.* overrides on the command line,
# e.g. model_name=resnet18,sampling_ratio=0.1; "" when there are none. Set it to name one.
variant: ${adcore.variant:}
output_dir: ${output_root}/${experiment.name}/${model.name}${adcore.subdir:${variant}}
# Resume even though model/experiment settings changed since the directory was made.
force: false
progress: true

tracking:
  enabled: true
  experiment: ${experiment.name}
  arch: ${model.name}
  tracking_uri: null  # null: $MLFLOW_TRACKING_URI, else sqlite:///mlflow.db
  sweep: null         # null: <model.name>[<variant>] with a variant, else the name of output_dir
  tags: {}

hydra:
  job:
    name: adcore
    chdir: false
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_root}
    subdir: ${experiment.name}/${model.name}${adcore.subdir:${variant}}
