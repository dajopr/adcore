name: mvtec-ad2-fewshot  # MLflow experiment, and the output directory
root: ${oc.env:MVTEC_AD2_ROOT}
spec: mvtec_ad2      # mvtec | visa | mvtec_ad2 | realiad | {_target_: adcore.DatasetSpec, ...}
categories: null     # null = every category of the spec
shots: [1, 2, 4, 8]  # null in the list = every training frame
seeds: [0, 1, 2]
anomalous_fraction: 0.0
batch_size: 32
num_workers: 4
cache_test_set: true # at 672 on the short side a category's test_public is ~1-2 GB in memory
trainer: {}          # Trainer kwargs for every model
fpr_limit: 0.05      # AUPRO's FPR limit, as MVTec AD 2 reports it; unset = the module's (0.3)
# The images are 1-8 MP and not square. Resize the short side, keeping the aspect ratio:
#   model.transform='{_target_: adcore.default_transform, image_size: 672, multiple: 14}'
# Image and pixel thresholds are chosen on each category's validation/ (the holdout split)
# and image/seg F1, precision and recall reported at them. Unset = the module's rule,
# adcore.QuantileThreshold() (image_fpr 0.05, pixel_fpr 0.01). To change it:
#   +experiment.threshold='{_target_: adcore.QuantileThreshold, image_fpr: 0.01, pixel_fpr: 0.001}'
