[project]
name = "adcore"
version = "0.1.0"
description = "PatchCore, MVTec AD loading, anomaly-detection metrics, evaluation and few-shot experiments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "lightning>=2.5",
    "numpy",
    "pandas>=2",
    "pillow",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adcore"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
